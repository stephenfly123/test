<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --status-green: #22c55e;
            --accent-blue: #38bdf8;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .pulse-dot {
            width: 14px;
            height: 14px;
            background-color: var(--status-green);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px var(--status-green);
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid var(--status-green);
            border-radius: 50%;
            animation: pulse 1.8s infinite ease-out;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .status-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .status-text {
            color: var(--status-green);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .info-grid {
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-main);
            font-weight: bold;
        }

        .clock-val {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="status-card">
        <div class="header">
            <div class="pulse-dot"></div>
            <h1>CORE NODE</h1>
        </div>

        <div class="status-box">
            <span class="status-text">SYSTEM RUNNING</span>
        </div>

        <div class="info-grid">
            <div class="info-row">
                <span>STATUS:</span>
                <span class="info-value" style="color: var(--status-green);">ONLINE</span>
            </div>
            <div class="info-row">
                <span>ZULU TIME:</span>
                <span class="info-value clock-val" id="utc-clock">00:00:00 Z</span>
            </div>
            <div class="info-row">
                <span>UPTIME:</span>
                <span class="info-value" id="uptime">0d 0h 0m 0s</span>
            </div>
        </div>
    </div>

    <script>
        // 1. Live UTC Clock
        function updateClock() {
            const now = new Date();
            const h = String(now.getUTCHours()).padStart(2, '0');
            const m = String(now.getUTCMinutes()).padStart(2, '0');
            const s = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('utc-clock').innerText = `${h}:${m}:${s} Z`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Uptime Counter
        const startTime = Date.now();
        function updateUptime() {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const d = Math.floor(diff / 86400);
            const h = Math.floor((diff % 86400) / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;
            document.getElementById('uptime').innerText = `${d}d ${h}h ${m}m ${s}s`;
        }
        setInterval(updateUptime, 1000);
        updateUptime();
    </script>

</body>
</html>
