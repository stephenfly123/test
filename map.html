<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: sans-serif;
        }
        
        #map-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="map-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Initialize the map (Coordinates set to Cairo as an example, zoom level 11)
        const map = L.map('map-container').setView([30.0444, 31.2357], 11);

        // Add clean tile layer (OpenStreetMap tiles)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Optional: Add a simple marker with a popup
        const marker = L.marker([30.0444, 31.2357]).addTo(map);
        marker.bindPopup("<b>Current Location</b><br>Active and running.").openPopup();
    </script>

</body>
</html>
