<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Public Feed</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #05050a; color: #f8fafc; padding: 20px; }
        .feed-container { max-width: 600px; margin: 0 auto; }
        h1 { color: #22c55e; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .post { background: #111827; border-left: 4px solid #22c55e; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .time { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold; }
        .content { font-size: 1.1rem; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="feed-container">
        <h1>LIVE OPERATIONS FEED</h1>
        <div id="feed">
            <!-- Posts will appear here automatically -->
        </div>
    </div>

    <script>
        function loadPosts() {
            const feed = document.getElementById('feed');
            const posts = JSON.parse(localStorage.getItem('livePosts') || '[]');
            
            if (posts.length === 0) {
                feed.innerHTML = "<p style='color: #94a3b8;'>Waiting for incoming transmissions...</p>";
                return;
            }

            feed.innerHTML = ''; // Clear current feed
            
            // Render all posts
            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `
                    <div class="time">${post.time}</div>
                    <div class="content">${post.text}</div>
                `;
                feed.appendChild(postDiv);
            });
        }

        // Load posts immediately when page opens
        loadPosts();

        // Magic trick: Listen for updates from the Admin page in real-time
        window.addEventListener('storage', function(e) {
            if (e.key === 'livePosts') {
                loadPosts();
            }
        });
    </script>
</body>
</html>
