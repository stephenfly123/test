<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Public Data Feed</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #05050a; color: #f8fafc; padding: 20px; }
        .feed-container { max-width: 600px; margin: 0 auto; }
        
        /* Header Layout */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; /* Aligns items to the top */
            border-bottom: 1px dashed #1e293b; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
        }
        
        h1 { color: #22c55e; margin: 0; font-size: 1.5rem; line-height: 1.2; }
        
        /* Contact Section Group */
        .contact-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Aligns everything to the right */
            text-align: right;
            max-width: 220px;
        }

        /* Contact Button Style */
        .contact-btn { 
            background: transparent; 
            border: 1px solid #38bdf8; 
            color: #38bdf8; 
            padding: 8px 15px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 4px; 
            font-size: 0.85rem;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .contact-btn:hover { 
            background: rgba(56, 189, 248, 0.15); 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        
        /* Text below the button */
        .contact-subtext {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 6px;
            line-height: 1.3;
        }

        /* Copied Alert */
        .copied-alert {
            color: #22c55e;
            font-size: 0.7rem;
            margin-top: 4px;
            display: none;
            font-weight: bold;
        }
        
        .time-badge { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold; }
        
        /* Note Style */
        .post-note { background: #111827; border-left: 4px solid #38bdf8; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .note-content { font-size: 1.1rem; line-height: 1.5; white-space: pre-wrap; }

        /* Blog Style */
        .post-blog { background: #111827; border-left: 4px solid #facc15; margin-bottom: 20px; border-radius: 4px; }
        
        summary { padding: 15px; cursor: pointer; font-size: 1.2rem; font-weight: bold; color: #facc15; list-style: none; outline: none; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: #1e293b; }
        
        .blog-content { padding: 0 15px 15px 15px; font-size: 1.1rem; line-height: 1.6; color: #e2e8f0; border-top: 1px solid #1e293b; white-space: pre-wrap; margin-top: 10px; }
        
    </style>
</head>
<body>

    <div class="feed-container">
        
        <div class="header-container">
            <h1>NEXUS // LIVE TRANSMISSIONS</h1>
            
            <div class="contact-group">
                <!-- Mailto link + JavaScript copy fallback -->
                <a href="mailto:stephen@stephencloud.online?subject=Topic%20Request&body=Hi%20Stephen,%0A%0AHere%20is%20what%20I%20want%20you%20to%20write%20about:%0A" 
                   class="contact-btn" 
                   onclick="copyEmailToClipboard(event)">
                    ✉ CONTACT ME
                </a>
                <div class="contact-subtext">Tell me what's on your mind or what you want me to write about</div>
                <div class="copied-alert" id="copied-alert">Email copied to clipboard!</div>
            </div>
        </div>

        <div id="feed"></div>
    </div>

    <script>
        // Fallback: If mailto doesn't work, this copies the email address instantly
        function copyEmailToClipboard(event) {
            navigator.clipboard.writeText("stephen@stephencloud.online");
            const alertBox = document.getElementById('copied-alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }

        function loadPosts() {
            const feed = document.getElementById('feed');
            const posts = JSON.parse(localStorage.getItem('livePosts') || '[]');
            
            if (posts.length === 0) {
                feed.innerHTML = "<p style='color: #64748b;'>NO ACTIVE TRANSMISSIONS...</p>";
                return;
            }

            feed.innerHTML = ''; 
            
            posts.forEach(post => {
                if (post.type === 'note') {
                    const noteDiv = document.createElement('div');
                    noteDiv.className = 'post-note';
                    noteDiv.innerHTML = `
                        <div class="time-badge">${post.time}</div>
                        <div class="note-content">${post.text}</div>
                    `;
                    feed.appendChild(noteDiv);
                } 
                else if (post.type === 'blog') {
                    const blogDetails = document.createElement('details');
                    blogDetails.className = 'post-blog';
                    blogDetails.innerHTML = `
                        <summary>
                            <div class="time-badge">${post.time}</div>
                            [+] ${post.title}
                        </summary>
                        <div class="blog-content">${post.text}</div>
                    `;
                    feed.appendChild(blogDetails);
                }
            });
        }

        loadPosts();
        window.addEventListener('storage', function(e) {
            if (e.key === 'livePosts') loadPosts();
        });
    </script>
</body>
</html>
