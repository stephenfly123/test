<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Public Cloud Feed</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XW6XWZHWK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2XW6XWZHWK');
    </script>
    <!-- End Google tag -->

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5355424366172129"
         crossorigin="anonymous"></script>
    <!-- End Google AdSense -->

    <style>
        body { font-family: 'Courier New', monospace; background: #05050a; color: #f8fafc; padding: 20px; }
        .feed-container { max-width: 600px; margin: 0 auto; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed #1e293b; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { color: #22c55e; margin: 0; font-size: 1.5rem; line-height: 1.2; }
        
        .contact-group { display: flex; flex-direction: column; align-items: flex-end; text-align: right; max-width: 220px; }
        .contact-btn { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 15px; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 0.85rem; cursor: pointer; width: 100%; text-align: center; }
        .contact-btn:hover { background: rgba(56, 189, 248, 0.15); }
        .contact-subtext { color: #94a3b8; font-size: 0.75rem; margin-top: 6px; }
        
        .time-badge { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; font-weight: bold; }
        .post-note { background: #111827; border-left: 4px solid #38bdf8; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .note-content { font-size: 1.1rem; line-height: 1.5; white-space: pre-wrap; }
        
        .post-blog { background: #111827; border-left: 4px solid #facc15; margin-bottom: 20px; border-radius: 4px; }
        summary { padding: 15px; cursor: pointer; font-size: 1.2rem; font-weight: bold; color: #facc15; list-style: none; outline: none; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: #1e293b; }
        .blog-content { padding: 0 15px 15px 15px; font-size: 1.1rem; line-height: 1.6; color: #e2e8f0; border-top: 1px solid #1e293b; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="feed-container">
        <div class="header-container">
            <h1>NEXUS // CLOUD FEED</h1>
            <div class="contact-group">
                <a href="mailto:stephen@stephencloud.online?subject=Topic%20Request&body=Hi%20Stephen,%0A%0AHere%20is%20what%20I%20want%20you%20to%20write%20about:%0A" class="contact-btn">✉ CONTACT ME</a>
                <div class="contact-subtext">Tell me what you want me to write about</div>
            </div>
        </div>

        <div id="feed">
            <p style="color: #64748b;">CONNECTING TO GOOGLE CLOUD DATABASE...</p>
        </div>
    </div>

    <script>
        // Your specific Google Sheets API link
        const API_URL = 'https://sheetdb.io/api/v1/cauz9ltpdtgy6';

        async function loadPosts() {
            const feed = document.getElementById('feed');
            
            try {
                const response = await fetch(API_URL);
                let posts = await response.json();
                
                if (posts.length === 0) {
                    feed.innerHTML = "<p style='color: #64748b;'>NO ACTIVE TRANSMISSIONS...</p>";
                    return;
                }

                feed.innerHTML = ''; 
                posts.reverse(); // Put newest at the top
                
                posts.forEach(post => {
                    if (post.type === 'note') {
                        const noteDiv = document.createElement('div');
                        noteDiv.className = 'post-note';
                        noteDiv.innerHTML = `
                            <div class="time-badge">${post.time}</div>
                            <div class="note-content">${post.text}</div>
                        `;
                        feed.appendChild(noteDiv);
                    } 
                    else if (post.type === 'blog') {
                        const blogDetails = document.createElement('details');
                        blogDetails.className = 'post-blog';
                        blogDetails.innerHTML = `
                            <summary>
                                <div class="time-badge">${post.time}</div>
                                [+] ${post.title}
                            </summary>
                            <div class="blog-content">${post.text}</div>
                        `;
                        feed.appendChild(blogDetails);
                    }
                });
            } catch (err) {
                feed.innerHTML = "<p style='color: #ef4444;'>ERROR CONNECTING TO DATABASE.</p>";
            }
        }

        // Load immediately when page opens
        loadPosts();
        
        // Auto-refresh the page every 30 seconds to look for new posts
        setInterval(loadPosts, 30000);
    </script>
</body>
</html>
