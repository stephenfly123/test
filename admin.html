<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Center</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0f172a; color: #38bdf8; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
        textarea { width: 100%; height: 100px; background: #0f172a; color: #fff; border: 1px solid #38bdf8; padding: 10px; margin-bottom: 10px; font-family: inherit; }
        button { background: #38bdf8; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0ea5e9; }
        #status { color: #22c55e; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="box">
        <h2>TRANSMIT LIVE UPDATE</h2>
        <textarea id="post-text" placeholder="Type your live update here..."></textarea>
        <br>
        <button onclick="publishPost()">BROADCAST TO PUBLIC WEB</button>
        <div id="status"></div>
    </div>

    <script>
        function publishPost() {
            const text = document.getElementById('post-text').value;
            if (!text) return;

            // Get existing posts or create empty array
            let posts = JSON.parse(localStorage.getItem('livePosts') || '[]');
            
            // Add new post with timestamp
            const now = new Date();
            const timeString = String(now.getUTCHours()).padStart(2, '0') + ':' + 
                               String(now.getUTCMinutes()).padStart(2, '0') + ' ZULU';
            
            posts.unshift({ text: text, time: timeString }); // unshift puts it at the top
            
            // Save back to local storage
            localStorage.setItem('livePosts', JSON.stringify(posts));
            
            // Clear box and show status
            document.getElementById('post-text').value = '';
            document.getElementById('status').innerText = "STATUS: UPDATE BROADCASTED SUCCESSFULLY";
            
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
